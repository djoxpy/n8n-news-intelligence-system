services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: 
      - n8n
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    # image: n8nio/n8n:latest
    image: n8n-python
    container_name: n8n
    restart: unless-stopped
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PATH=${N8N_PATH}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=https://${PUBLIC_DOMAIN}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - path: .env
        required: true
    networks:
      - n8n
      - tailscale-caddy
    ports:
      - 5678

  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: 
      - n8n
    restart: unless-stopped
    ports:
      - 6333
    volumes:
      - qdrant_storage:/qdrant/storage

  article-deduplicator:
    build:
      context: ./deduplicator_service
      dockerfile: Dockerfile
    container_name: article-deduplicator
    ports:
      - 8000
    environment:
      - SIMILARITY_THRESHOLD=0.85
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
    volumes:
      - ./article-deduplicator-logs:/app/logs
    networks:
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  n8n_storage:
  postgres_storage:
  qdrant_storage:

networks:
  n8n:
    driver: bridge
  tailscale-caddy:
    external: true
